name: Pages

# Publishes the web app of every branch to GitHub Pages, one folder per branch:
#   https://armaxri.github.io/DeviceModeler/                    overview of all published branches with links
#                                                               to examples (structure diagrams, state machines)
#   https://armaxri.github.io/DeviceModeler/<branch>/           the web app of <branch> ("/" in branch names → "-")
#   https://armaxri.github.io/DeviceModeler/<branch>/?example=system.devm   the web app with an example opened
# The web app uses relative paths (vite base './'), so the same build runs in every folder (and in forks).
# The folder and the overview page are written by scripts/pages/update-site.sh (also usable locally).
# The site lives on the branch `gh-pages` (Settings → Pages → Deploy from a branch → gh-pages, / (root)).
# Deleting a branch removes its folder (the `delete` event runs the workflow of the default branch).

on:
  push:
    branches-ignore: [gh-pages]
  delete:
  workflow_dispatch:

permissions:
  contents: write

# one deployment at a time, so the commits to gh-pages don't race
concurrency:
  group: pages-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Branch and folder
        id: branch
        env:
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
        run: |
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "folder=${BRANCH//[^A-Za-z0-9._-]/-}" >> "$GITHUB_OUTPUT"

      # (also for a deleted branch: the default branch has scripts/pages/update-site.sh)
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'delete'
        with:
          node-version: 22
          cache: npm

      - name: Build the web app
        if: github.event_name != 'delete'
        run: |
          npm ci
          npm run build -w packages/language
          npm run build -w packages/web

      - name: Update gh-pages
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          FOLDER: ${{ steps.branch.outputs.folder }}
          DELETED: ${{ github.event_name == 'delete' }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi
          if [ "$DELETED" = "true" ]; then
            scripts/pages/update-site.sh site "$BRANCH" "$FOLDER" --delete "$REPO"
          else
            scripts/pages/update-site.sh site "$BRANCH" "$FOLDER" packages/web/dist "$REPO"
          fi

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Pages: ${BRANCH} ($([ "$DELETED" = "true" ] && echo removed || echo "$GITHUB_SHA"))"
            git push origin gh-pages
          fi
