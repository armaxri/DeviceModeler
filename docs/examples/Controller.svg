<text class="definition-line definition-scope" x="8" y="178.53">public:</text>
<text class="definition-line" x="8" y="193.53">  operation setConfig(config : const EpicProject::Config&amp;)</text>
<text class="definition-line" x="8" y="208.53">  const operation retryAllowed() : bool</text>
<text class="definition-line definition-scope" x="8" y="223.53">protected:</text>
