<text class="definition-line" x="8" y="253.53">  operation shutdown()</text>
<text class="definition-line" x="8" y="268.52">  var shutdownErrors : std::vector&lt;unsigned int&gt;</text>
<text class="definition-line definition-scope" x="8" y="283.52">private:</text>
<text class="definition-line" x="8" y="298.52">  var errorCnt : unsigned int = 0</text>
<text class="definition-line" x="8" y="313.52">  var config : EpicProject::Config</text>
<text class="definition-line" x="8" y="328.53">  var driver : EpicProject::Driver&amp;</text>
</g>
